name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests and Darwin compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '2'
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - name: Prepare private Go caches
        run: |
          case "${RUNNER_TEMP:?}" in
            /*) ;;
            *) exit 1 ;;
          esac
          case "$RUNNER_TEMP" in
            *$'\n'*|*$'\r'*) exit 1 ;;
          esac
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          test -O "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          umask 077
          cache_root=$(mktemp -d "$RUNNER_TEMP/router-go.XXXXXXXX")
          mkdir "$cache_root/mod" "$cache_root/build"
          printf 'GOMODCACHE=%s\nGOCACHE=%s\n' \
            "$cache_root/mod" "$cache_root/build" >> "$GITHUB_ENV"
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up exact module Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
          token: ''
      - name: Verify toolchain and formatting
        run: |
          expected=$(awk '$1 == "go" {print $2}' go.mod)
          [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(go env GOVERSION)" = "go$expected"
          git rev-parse HEAD
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Download and verify locked public dependencies
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Vet all packages
        run: go vet ./...
      - name: Test all packages on Linux
        run: go test -count=1 -timeout=3m ./...
      - name: Race test all packages on Linux
        run: go test -race -count=1 -timeout=5m ./...
      - name: Cross-compile all packages and tests for Darwin arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build ./...
          packages=$(go list ./...)
          test -n "$packages"
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          i=0
          while IFS= read -r package; do
            i=$((i + 1))
            go test -c -o "$out/$i.test" "$package"
          done <<< "$packages"
